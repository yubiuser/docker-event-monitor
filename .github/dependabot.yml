version: 2
updates:
- package-ecosystem: github-actions
  directory: "/"
  schedule:
    interval: weekly
    day: sunday
    time: "10:00"
  open-pull-requests-limit: 10
  target-branch: development
  groups:
    github_action-dependencies:
      patterns:
        - "*"
- package-ecosystem: gomod
  directory: "/"
  schedule:
    interval: weekly
    day: sunday
    time: "10:00"
  open-pull-requests-limit: 10
  target-branch: development
  groups:
    go-dependencies:
      patterns:
        - "*"
- package-ecosystem: "docker"
  directories:
    - "/"
    - "/.devcontainer/"
  schedule:
    interval: "weekly"
    day: sunday
    time: "10:00"
  open-pull-requests-limit: 10
  target-branch: development
  groups:
    docker-dependencies:
      patterns:
        - "*"
